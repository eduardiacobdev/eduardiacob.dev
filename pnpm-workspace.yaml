# pnpm workspace (TASKS T2.2). Supply-chain settings apply to every package.
packages:
  - apps/web

# Skip releases younger than 7 days, like the Dependabot cooldown.
minimumReleaseAge: 10080
# Install scripts run only for packages listed here (none needed yet).
strictDepBuilds: true

# Security overrides. Remove each one when the parent depends on a fixed
# version by itself (check with `pnpm why <package> -r`).
overrides:
  # GHSA-g3hv-75wg-m249 (DoS by glob pattern amplification): fixed only in
  # minimatch 11. Lint-time only (typescript-eslint), never in the site.
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
