# Checks for every pull request and every push to main (TASKS T2.5).
# Third-party actions are pinned to a full commit SHA; Dependabot bumps them.
# Docs: docs/runbooks/ci.md
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.17.2
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  gitleaks:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          # Same version as the local pre-commit hook (docs/runbooks/tooling.md).
          # Without it the action downloads the latest release on every run.
          GITLEAKS_VERSION: "8.30.1"

  terraform:
    name: terraform (fmt, validate, tflint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff infra
      - name: init (no backend)
        run: terraform -chdir=infra/envs/prod init -backend=false -lockfile=readonly
      - name: validate
        run: terraform -chdir=infra/envs/prod validate -no-color
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: tflint
        run: tflint --chdir=infra --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  checkov:
    name: policy (checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@a32f8b5c5c7c958bc38947c65dfe139debaf0607 # v12.3140.0
        with:
          directory: .
          framework: terraform,github_actions
          quiet: true
          compact: true
          download_external_modules: false

  shellcheck:
    name: scripts (shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh

  # apps/web: same pnpm as the Mac (packageManager in package.json, through
  # Corepack). No dependency cache: installs stay reproducible from the lockfile.
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: pnpm via corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable pnpm
          pnpm --version
      - name: install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm --filter web lint
      - name: typecheck
        run: pnpm --filter web typecheck
      - name: test
        run: pnpm --filter web test
      - name: build
        run: pnpm --filter web build

  # Plan against the real state, posted on the PR. The repo is public, so the
  # comment and the log show only Terraform's masked output, with any Gmail
  # address redacted on top. Skipped for forks and Dependabot (no secrets).
  plan:
    name: terraform plan (prod)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: tfstate-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init (R2 state)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]] || { echo "::error::R2 secrets missing, see docs/runbooks/ci.md"; exit 1; }
          terraform -chdir=infra/envs/prod init -lockfile=readonly -no-color
      - name: plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_gmail_address: ${{ secrets.TF_VAR_GMAIL_ADDRESS }}
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$TF_VAR_gmail_address" ]] || { echo "::error::Cloudflare or Gmail secret missing, see docs/runbooks/ci.md"; exit 1; }
          gmail_user="${TF_VAR_gmail_address%@*}"
          echo "::add-mask::${gmail_user}"
          set +e
          terraform -chdir=infra/envs/prod plan -no-color -detailed-exitcode -lock-timeout=120s -out=tfplan > "$RUNNER_TEMP/raw.txt" 2>&1
          code=$?
          set -e
          GMAIL_USER="$gmail_user" perl -pe 's/\Q$ENV{GMAIL_USER}\E/<redacted>/g; s/[\w.%+-]+\@gmail\.com/<redacted>\@gmail.com/g' "$RUNNER_TEMP/raw.txt" > "$RUNNER_TEMP/plan.txt"
          rm -f "$RUNNER_TEMP/raw.txt" infra/envs/prod/tfplan
          cat "$RUNNER_TEMP/plan.txt"
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          [[ "$code" -ne 1 ]]
      - name: comment on the PR
        if: always() && steps.plan.outputs.exitcode != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.plan.outputs.exitcode }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$CODE" in
            0) status="No changes." ;;
            2) status="Changes to apply after merge." ;;
            *) status="Plan failed." ;;
          esac
          {
            echo "### terraform plan: \`infra/envs/prod\`"
            echo
            echo "${status} Commit ${SHA:0:7}. Sensitive values are masked."
            echo
            echo "<details><summary>Plan output</summary>"
            echo
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/plan.txt"
            echo '```'
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none
