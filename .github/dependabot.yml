# Version updates (architecture review A3). Security updates are on in the
# repo settings. Cooldown skips releases younger than a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - /infra/envs/prod
      - /infra/modules/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: build

  # pnpm workspace (root lockfile). Grouped weekly; security updates still
  # arrive on their own as soon as an advisory is published.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
    # Held back on purpose (docs/runbooks/web.md): eslint-config-next does not
    # support ESLint 10 or TypeScript 6.1+ yet, and @types/node follows the
    # Node major in .node-version. Lift each one when that changes.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        versions: [">= 6.1.0"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
