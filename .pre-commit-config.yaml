# Local git hooks (TASKS T2.1). CI runs the same gitleaks version and stricter
# checks; these catch problems before a commit leaves the Mac.
# Setup: docs/runbooks/tooling.md. Third-party hooks are pinned to a commit SHA.
default_install_hook_types: [pre-commit]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: scripts/with-local-bin.sh gitleaks git --pre-commit --staged --redact --no-banner --verbose
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: terraform-fmt
        name: terraform fmt
        entry: scripts/with-local-bin.sh terraform fmt -check -diff -recursive infra
        language: system
        files: \.(tf|tfvars)$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
        # pnpm 11+ writes the lockfile as two YAML documents; pnpm validates it.
        exclude: ^pnpm-lock\.yaml$
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
